name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kanakku_user
          POSTGRES_PASSWORD: kanakku_dev_password
          POSTGRES_DB: kanakku_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.6.0 --activate

      - name: Install dependencies
        run: |
          pnpm install
          pnpm approve-builds --all

      - name: Run build
        run: pnpm build

      - name: Run linter
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run database migrations and seed
        run: |
          pnpm db:migrate
          pnpm seed
        env:
          DATABASE_URL: postgresql://kanakku_user:kanakku_dev_password@localhost:5433/kanakku_db

      - name: Run unit and integration tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://kanakku_user:kanakku_dev_password@localhost:5433/kanakku_db
